# Paved Road caller: the only CI file an app team owns.
# Every security control lives in Triorex/paved-road-platform at the pinned commit below.
# Dependabot (github-actions ecosystem) opens a PR when the platform ships a new release.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-security:
    name: pr-security
    uses: Triorex/paved-road-platform/.github/workflows/pr-security.yml@72bb39787251c05b5234ca0a602d0b2c4ac3c3d3 # v1.0.3-rc.1
    with:
      codeql-languages: '["python","actions"]'
    permissions:
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
      actions: read

  build:
    name: secure-build
    if: github.event_name == 'push'
    needs: pr-security
    uses: Triorex/paved-road-platform/.github/workflows/secure-build.yml@72bb39787251c05b5234ca0a602d0b2c4ac3c3d3 # v1.0.3-rc.1
    with:
      image-name: payments-api
      language: python
      install-command: pip install -r requirements.txt -r requirements-dev.txt
      test-command: python -m pytest -q
      dast-mode: api
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
      attestations: write

  admission:
    name: admission-test
    needs: build
    uses: Triorex/paved-road-platform/.github/workflows/admission-test.yml@72bb39787251c05b5234ca0a602d0b2c4ac3c3d3 # v1.0.3-rc.1
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write

  staging:
    name: release-staging
    needs: [build, admission]
    uses: Triorex/paved-road-platform/.github/workflows/release.yml@72bb39787251c05b5234ca0a602d0b2c4ac3c3d3 # v1.0.3-rc.1
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write # sign the promotion attestation
      attestations: write

  production:
    name: release-production
    needs: [build, staging]
    uses: Triorex/paved-road-platform/.github/workflows/release.yml@72bb39787251c05b5234ca0a602d0b2c4ac3c3d3 # v1.0.3-rc.1
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      environment: production
    permissions:
      contents: write # record the production release
      actions: read # read who approved the deployment
      packages: write
      id-token: write
      attestations: write
