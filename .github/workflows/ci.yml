# Paved Road caller: the only CI file an app team owns.
# Every security control lives in Triorex/paved-road-platform at the pinned commit below.
# Dependabot (github-actions ecosystem) opens a PR when the platform ships a new release.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**'] # docs-only changes ship nothing

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-security:
    name: pr-security
    uses: Triorex/paved-road-platform/.github/workflows/pr-security.yml@13a5622411c31a3cf8f162c176c9016a37bded48 # v1.1.0-rc.1
    with:
      codeql-languages: '["python","actions"]'
    permissions:
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
      actions: read

  # Builds right away; pr-security re-runs on main in parallel and gates the staging promotion.
  build:
    name: secure-build
    if: github.event_name == 'push'
    uses: Triorex/paved-road-platform/.github/workflows/secure-build.yml@13a5622411c31a3cf8f162c176c9016a37bded48 # v1.1.0-rc.1
    with:
      image-name: payments-api
      language: python
      install-command: pip install -r requirements.txt -r requirements-dev.txt
      test-command: python -m pytest -q
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
      attestations: write

  staging:
    name: release-staging
    needs: [pr-security, build]
    uses: Triorex/paved-road-platform/.github/workflows/release.yml@13a5622411c31a3cf8f162c176c9016a37bded48 # v1.1.0-rc.1
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      environment: staging
    permissions:
      contents: read
      deployments: read # refuse to move staging backwards
      packages: write
      id-token: write # sign the promotion attestation
      attestations: write

  # Admission + DAST against the workload deployed at the staging digest; production needs its attestation.
  staging-verify:
    name: staging-verify
    needs: [build, staging]
    uses: Triorex/paved-road-platform/.github/workflows/staging-verify.yml@13a5622411c31a3cf8f162c176c9016a37bded48 # v1.1.0-rc.1
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      dast-mode: api
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  production:
    name: release-production
    needs: [build, staging-verify]
    uses: Triorex/paved-road-platform/.github/workflows/release.yml@13a5622411c31a3cf8f162c176c9016a37bded48 # v1.1.0-rc.1
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      environment: production
    permissions:
      contents: read
      deployments: read
      packages: write
      id-token: write
      attestations: write

  record-release:
    name: record-release
    needs: [build, production]
    uses: Triorex/paved-road-platform/.github/workflows/record-release.yml@13a5622411c31a3cf8f162c176c9016a37bded48 # v1.1.0-rc.1
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
    permissions:
      contents: write # create the release and its tag
      actions: read # read who approved the production deployment
