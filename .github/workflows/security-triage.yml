# Daily risk-based triage: scanner alerts -> KEV/EPSS priority -> issues with SLA due dates.
name: security-triage

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  triage:
    name: triage
    uses: Triorex/paved-road-platform/.github/workflows/vuln-triage.yml@13a5622411c31a3cf8f162c176c9016a37bded48 # v1.1.0-rc.1
    permissions:
      contents: read
      security-events: read
      issues: write
      id-token: write
