# Daily risk-based triage: scanner alerts -> KEV/EPSS priority -> issues with SLA due dates.
name: security-triage

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  triage:
    name: triage
    uses: Triorex/paved-road-platform/.github/workflows/vuln-triage.yml@72bb39787251c05b5234ca0a602d0b2c4ac3c3d3 # v1.0.3-rc.1
    permissions:
      contents: read
      security-events: read
      issues: write
      id-token: write
