# Daily risk-based triage: scanner alerts -> KEV/EPSS priority -> issues with SLA due dates.
name: security-triage

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  triage:
    name: triage
    uses: Triorex/paved-road-platform/.github/workflows/vuln-triage.yml@99ca3d839c11ebf8c09491801620049f159e73e4 # v1.0.0
    permissions:
      contents: read
      security-events: read
      issues: write
      id-token: write
