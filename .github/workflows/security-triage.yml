# Daily risk-based triage: scanner alerts -> KEV/EPSS priority -> issues with SLA due dates.
name: security-triage

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  triage:
    name: triage
    uses: Triorex/paved-road-platform/.github/workflows/vuln-triage.yml@d492f285f58e1c600181e20dca5a59f3c82f58d4 # v1.2.0-rc.1
    permissions:
      contents: read
      security-events: read
      issues: write
      id-token: write
