# Daily risk-based triage: scanner alerts -> KEV/EPSS priority -> issues with SLA due dates.
name: security-triage

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  triage:
    name: triage
    uses: Triorex/paved-road-platform/.github/workflows/vuln-triage.yml@2e595938f560f36dce6755c55329b05a3c8b53d2 # v1.0.2
    permissions:
      contents: read
      security-events: read
      issues: write
      id-token: write
