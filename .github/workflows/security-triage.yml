# Daily risk-based triage: scanner alerts -> KEV/EPSS priority -> issues with SLA due dates.
name: security-triage

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  triage:
    name: triage
    uses: Triorex/paved-road-platform/.github/workflows/vuln-triage.yml@165f205413662a52a97d57768de81d0afd120607 # v1.2.0
    permissions:
      contents: read
      security-events: read
      issues: write
      id-token: write
