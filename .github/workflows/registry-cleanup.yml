# Weekly registry hygiene: report (and, once reviewed, delete) images that never reached an environment.
name: registry-cleanup

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    name: cleanup
    uses: Triorex/paved-road-platform/.github/workflows/registry-cleanup.yml@d492f285f58e1c600181e20dca5a59f3c82f58d4 # v1.2.0-rc.1
    with:
      apply: false # flip to true after reviewing the first report
    permissions:
      contents: read
      packages: write
      id-token: write
