# Weekly registry hygiene: report (and, once reviewed, delete) images that never reached an environment.
name: registry-cleanup

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    name: cleanup
    uses: Triorex/paved-road-platform/.github/workflows/registry-cleanup.yml@165f205413662a52a97d57768de81d0afd120607 # v1.2.0
    with:
      apply: false # flip to true after reviewing the first report
    permissions:
      contents: read
      packages: write
      id-token: write
