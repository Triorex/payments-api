# Weekly registry hygiene: report (and, once reviewed, delete) images that never reached an environment.
name: registry-cleanup

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    name: cleanup
    uses: Triorex/paved-road-platform/.github/workflows/registry-cleanup.yml@13a5622411c31a3cf8f162c176c9016a37bded48 # v1.1.0
    with:
      apply: false # flip to true after reviewing the first report
    permissions:
      contents: read
      packages: write
      id-token: write
